<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Промпт в будущее</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .card {
      max-width: 420px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 36px 24px;
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }

    .logo {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      margin: 0 auto 20px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 34px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .footer {
      margin-top: 24px;
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🤖</div>
    <h1>Промпт в будущее</h1>
    <p>
      Канал о нейросетях, полезных промптах и способах заработка с помощью ИИ.
    </p>

    <a class="btn" href="https://t.me/aprompttg" target="_blank">
      Подписаться в Telegram
    </a>

    <div class="footer">
      © 2026 Промпт в будущее
    </div>
  </div>
</body>
</html>
